<!DOCTYPE html>
<html>
<head>
    <title>SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
    .navbar {
        background-color: #003cff;
    }

    .navbar .navbar-brand {
        color: #ffffff;
    }

    .card {
        background-color: #002397;
    }

    h1, h4, .form-label {
        color: #ffffff;
    }

    #sku_output {
        color: #ffffff;
        font-weight: bold;
    }
</style>
</head>

<body class="bg-light">

    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                River's AFFORDABLE yum yums 🤑
            </a>

            <div>
                <a class="btn btn-outline-light btn-sm" href="index.html">
                    Receipt Generator
                </a>

                <a class="btn btn-outline-light btn-sm" href="sku.html">
                    SKU Generator
                </a>
            </div>

        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">

            <div class="card-body">

                <h1 class="text-center mb-4">SKU Generator</h1>

                <div class="mb-3">
                    <label class="form-label">
                        What kind of food?
                    </label>

                    <input type="text"
                           id="category"
                           class="form-control"
                           placeholder="ulam, sabaw or inumin">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Food name?
                    </label>

                    <input type="text"
                           id="product_name"
                           class="form-control"
                           placeholder="Like sisig, sinigang or milo">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        How many?
                    </label>

                    <input type="number"
                           id="quantity"
                           class="form-control"
                           placeholder="NUMBER">
                </div>

                <button class="btn btn-primary" py-click="SKU_generator">
                    Generate SKU
                </button>

                <div id="sku_output" class="mt-4"></div>

            </div>
        </div>
    </div>

    <script type="py">

from pyscript import display, document

def SKU_generator(e):

    document.getElementById("sku_output").innerHTML = ""

    category = document.getElementById("category").value
    product_name = document.getElementById("product_name").value
    stock_qty = document.getElementById("quantity").value

    sku = (
        category[:3].upper()
        + "-"
        + product_name[:4].upper()
        + "-"
        + str(stock_qty)
    )

    display("SKU: " + sku, target="sku_output")

    </script>

</body>
</html>
